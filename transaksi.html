<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengalihkan Transaksi - KokoRBX</title>
  <style>
    :root {
      --bg: #f8faff;
      --panel: rgba(255, 255, 255, .84);
      --line: #dde6f8;
      --text: #1e2a55;
      --muted: #6f7da7;
      --purple: #8b7cff;
      --blue: #6f8dff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(139, 124, 255, .18), transparent 30%),
        radial-gradient(circle at 82% 22%, rgba(98, 216, 212, .18), transparent 30%),
        linear-gradient(135deg, #f8faff 0%, #eaf1ff 52%, #edebff 100%);
    }

    .card {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(111, 141, 255, .18);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 0;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #11131d;
      color: #fff;
      box-shadow: 0 14px 28px rgba(30, 42, 85, .22);
    }

    .brand em {
      color: var(--purple);
      font-style: normal;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 22px;
      max-width: 32ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 20px;
      border: 4px solid rgba(139, 124, 255, .18);
      border-top-color: var(--purple);
      border-radius: 999px;
      animation: spin .85s linear infinite;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      background: rgba(255, 255, 255, .78);
    }

    a.primary {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--blue));
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 520px) {
      body { padding: 18px; }
      .card { padding: 22px; border-radius: 20px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand" aria-label="KokoRBX">
      <span class="brand-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="2"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
      <span>Koko<em>RBX</em></span>
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Mengalihkan ke versi terbaru</h1>
    <p>Panel transaksi lama sudah ditutup. Kamu akan dibawa ke kotak pesan transaksi terbaru.</p>
    <div class="actions">
      <a class="primary" id="buyer-link" href="transaksi-buyer.html">Kotak Pesan</a>
      <a id="admin-link" href="admin.html#panel">Admin Panel</a>
    </div>
  </main>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var isAdmin = params.get('admin') === '1' || params.get('view') === 'admin' || window.location.hash === '#admin';
      var target = isAdmin
        ? 'admin.html#panel'
        : 'transaksi-buyer.html' + window.location.search + (window.location.hash && window.location.hash !== '#admin' ? window.location.hash : '');

      document.getElementById('buyer-link').href = 'transaksi-buyer.html' + window.location.search;
      document.getElementById('admin-link').href = 'admin.html#panel';
      window.setTimeout(function() {
        window.location.replace(target);
      }, 450);
    })();
  </script>
</body>
</html>
