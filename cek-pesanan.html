<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Pesanan - KokoRBX</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/cart-client.css?v=icon-cart-mobile-20260531">
  <link rel="stylesheet" href="assets/kokorbx-theme.css?v=contrast-theme-20260601">
  <link rel="stylesheet" href="assets/roblox-profile.css?v=roblox-profile-20260602">
  <link rel="stylesheet" href="assets/kokorbx-transactions.css?v=market-flow-20260602">
  <script src="assets/kokorbx-theme-toggle.js?v=dark-toggle-20260601"></script>
  <script defer src="assets/roblox-profile.js?v=roblox-profile-20260602"></script>
  <script defer src="assets/kokorbx-transactions.js?v=market-flow-20260602"></script>
  <style>
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .check-intro {
      display: grid;
      gap: 10px;
      padding: 20px 18px 0;
    }
    .check-safe {
      padding: 12px 14px;
      border: 1px solid rgba(119, 221, 168, .38);
      border-radius: 16px;
      color: #248461;
      background: rgba(119, 221, 168, .13);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 800;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 100%);
      min-height: 66px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(221, 230, 248, .9);
      border-bottom: 0;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -14px 38px rgba(30, 42, 85, .12);
      z-index: 90;
      overflow: hidden;
    }
    .bottom-nav a {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      color: #68748f;
      font-size: 11px;
      font-weight: 800;
    }
    .bottom-nav a.active { color: var(--koko-blue); }
    .nav-dot {
      width: 21px;
      height: 21px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: currentColor;
      opacity: .88;
    }
    html[data-koko-theme="dark"] .bottom-nav {
      background: rgba(14, 20, 43, .95);
      border-color: rgba(124, 140, 205, .34);
    }
  </style>
</head>
<body class="koko-market-page" data-koko-check-page>
  <main class="koko-market-shell">
    <header class="koko-market-header">
      <a class="koko-market-back" href="index.html" aria-label="Kembali">K</a>
      <div class="koko-market-title">
        <h1>Cek Pesanan</h1>
        <p>Lihat status order dari ID pesanan atau invoice.</p>
      </div>
      <button class="koko-market-icon-btn koko-theme-toggle" type="button" aria-label="Ganti tema"></button>
    </header>

    <section class="check-intro">
      <div class="check-safe">Data pesanan hanya ditampilkan dari order milik akun Roblox yang sedang terhubung di browser ini.</div>
    </section>

    <section class="koko-check-card">
      <form class="koko-check-form" data-check-form>
        <label for="koko-check-id">ID Pesanan / Invoice</label>
        <input id="koko-check-id" data-check-input placeholder="Contoh: RBX-123456" autocomplete="off">
        <button class="koko-primary-action" type="submit">Cek Pesanan</button>
      </form>
      <div data-check-result></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <a href="index.html"><span class="nav-dot"></span><span>Home</span></a>
    <a href="index.html#produk"><span class="nav-dot"></span><span>Produk</span></a>
    <a class="active" href="cek-pesanan.html"><span class="nav-dot"></span><span>Cek</span></a>
    <a href="transaksi.html"><span class="nav-dot"></span><span>Transaksi</span></a>
    <a href="akun.html"><span class="nav-dot"></span><span>Akun</span></a>
  </nav>

  <script src="assets/cart-client.js?v=icon-cart-mobile-20260531"></script>
</body>
</html>
