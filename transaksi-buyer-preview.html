<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Preview Kotak Pesan Buyer - KokoRBX</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F8FAFF;
    --sky: #EAF1FF;
    --lav: #EDEBFF;
    --blue-soft: #DCE8FF;
    --purple: #8B7CFF;
    --blue: #6F8DFF;
    --mint: #62D8D4;
    --green: #77DDA8;
    --text: #1E2A55;
    --muted: #7080A8;
    --line: #DDE6F8;
    --shadow: 0 18px 45px rgba(111, 141, 255, .16);
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(139, 124, 255, .18), transparent 26%),
      radial-gradient(circle at 92% 14%, rgba(98, 216, 212, .16), transparent 24%),
      linear-gradient(135deg, #F8FAFF, #EAF1FF 52%, #F8FAFF);
  }

  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .app {
    width: min(1180px, calc(100% - 28px));
    min-height: 100vh;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 14px;
    padding: 18px 0;
  }

  .chat-shell,
  .side-panel {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: rgba(255, 255, 255, .86);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .chat-shell {
    min-height: calc(100vh - 36px);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .chat-top {
    min-height: 76px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: rgba(248, 250, 255, .94);
    padding: 13px 15px;
  }

  .brand-mark,
  .avatar {
    display: grid;
    place-items: center;
    border-radius: 13px;
    color: #fff;
    background: linear-gradient(145deg, #171927, #070910);
    box-shadow: 0 12px 24px rgba(9, 12, 28, .20);
  }

  .brand-mark {
    position: relative;
    width: 42px;
    height: 42px;
  }

  .brand-mark::before {
    content: "";
    width: 17px;
    height: 17px;
    border: 3px solid #fff;
    border-radius: 5px;
    transform: rotate(-13deg);
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: #fff;
  }

  .top-title {
    min-width: 0;
  }

  .top-title strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "Outfit", sans-serif;
    font-size: 20px;
    font-weight: 900;
  }

  .top-title span {
    display: block;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid rgba(119, 221, 168, .42);
    border-radius: 999px;
    background: rgba(119, 221, 168, .16);
    color: #2A9364;
    padding: 8px 11px;
    font-size: 11px;
    font-weight: 900;
    white-space: nowrap;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: currentColor;
  }

  .chat-log {
    min-height: 0;
    overflow: auto;
    display: grid;
    align-content: start;
    gap: 12px;
    padding: 16px;
    background:
      linear-gradient(rgba(111, 141, 255, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(111, 141, 255, .04) 1px, transparent 1px),
      rgba(234, 241, 255, .52);
    background-size: 30px 30px, 30px 30px, auto;
  }

  .day-chip {
    justify-self: center;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .88);
    color: var(--muted);
    padding: 6px 11px;
    font-size: 11px;
    font-weight: 900;
  }

  .bubble-row {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 8px;
    align-items: end;
    max-width: 76%;
  }

  .bubble-row.me {
    justify-self: end;
    grid-template-columns: minmax(0, 1fr) 34px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    font-size: 12px;
    font-weight: 900;
  }

  .avatar.seller {
    background: linear-gradient(145deg, var(--purple), var(--blue));
  }

  .avatar.admin {
    background: linear-gradient(145deg, var(--mint), var(--blue));
  }

  .avatar.buyer {
    background: linear-gradient(145deg, #DCE8FF, #8B7CFF);
  }

  .bubble {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 16px 16px 16px 5px;
    background: rgba(255, 255, 255, .94);
    padding: 10px 12px;
    box-shadow: 0 10px 22px rgba(111, 141, 255, .09);
  }

  .bubble-row.me .bubble {
    border-color: rgba(139, 124, 255, .18);
    border-radius: 16px 16px 5px 16px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: #fff;
  }

  .bubble.system {
    justify-self: center;
    width: min(100%, 620px);
    border: 1px solid rgba(255, 203, 87, .42);
    border-radius: 14px;
    background: rgba(255, 250, 232, .92);
    color: var(--text);
    padding: 12px 14px;
  }

  .bubble-name {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 5px;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    opacity: .78;
  }

  .bubble-text {
    font-size: 13px;
    line-height: 1.48;
    font-weight: 700;
    word-break: break-word;
  }

  .bubble-time {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    opacity: .62;
    text-align: right;
    font-weight: 800;
  }

  .quick-actions {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, .76);
    padding: 10px 12px;
    scrollbar-width: none;
  }

  .quick-actions::-webkit-scrollbar { display: none; }

  .quick-btn,
  .send-btn,
  .side-btn {
    border: 0;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
  }

  .quick-btn {
    min-height: 38px;
    padding: 0 12px;
  }

  .quick-btn.light {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
  }

  .compose {
    border-top: 1px solid var(--line);
    background: rgba(248, 250, 255, .96);
    padding: 12px;
  }

  .compose-box {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 8px;
    align-items: end;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--purple);
    font-weight: 900;
  }

  .compose textarea {
    width: 100%;
    min-height: 42px;
    max-height: 120px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    outline: 0;
    padding: 11px 12px;
    font-size: 13px;
    line-height: 1.4;
    font-weight: 700;
  }

  .send-btn {
    min-width: 76px;
    min-height: 42px;
    padding: 0 14px;
  }

  .side-panel {
    position: sticky;
    top: 18px;
    align-self: start;
  }

  .side-head {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding: 14px;
  }

  .side-title {
    font-family: "Outfit", sans-serif;
    font-size: 18px;
    font-weight: 900;
  }

  .side-sub {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .product-img {
    width: 58px;
    height: 58px;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--sky);
  }

  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .side-body {
    display: grid;
    gap: 12px;
    padding: 14px;
  }

  .order-box {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(248, 250, 255, .82);
    padding: 12px;
  }

  .order-box h3 {
    margin: 0 0 10px;
    font-family: "Outfit", sans-serif;
    font-size: 16px;
  }

  .kv {
    display: grid;
    gap: 8px;
  }

  .kv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid rgba(221, 230, 248, .74);
    padding-bottom: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .kv-row:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }

  .kv-row strong {
    color: var(--text);
    text-align: right;
  }

  .side-btn {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
  }

  .side-btn.light {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
  }

  .protect {
    border: 1px solid rgba(255, 203, 87, .42);
    border-radius: 14px;
    background: rgba(255, 250, 232, .92);
    padding: 12px;
  }

  .protect strong {
    display: block;
    margin-bottom: 5px;
    font-size: 13px;
  }

  .protect span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
    font-weight: 700;
  }

  @media (max-width: 940px) {
    .app {
      width: min(100% - 20px, 720px);
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 10px 0;
    }

    .side-panel {
      position: static;
      order: -1;
    }

    .side-body {
      grid-template-columns: 1fr 1fr;
    }

    .chat-shell {
      min-height: calc(100vh - 20px);
      border-radius: 16px;
    }
  }

  @media (max-width: 620px) {
    body {
      background: var(--sky);
    }

    .app {
      width: 100%;
      padding: 0;
      gap: 0;
    }

    .chat-shell {
      min-height: 100vh;
      border-width: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .side-panel {
      border-width: 0 0 1px;
      border-radius: 0;
      box-shadow: none;
    }

    .side-body {
      display: none;
    }

    .chat-top {
      min-height: 66px;
      padding: 10px 11px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
    }

    .top-title strong {
      font-size: 17px;
    }

    .top-title span {
      font-size: 11px;
    }

    .status-pill {
      display: none;
    }

    .chat-log {
      padding: 12px 10px;
    }

    .bubble-row {
      max-width: 92%;
    }

    .bubble.system {
      width: 100%;
    }

    .quick-actions {
      padding: 9px 10px;
    }

    .compose {
      padding: 10px;
    }

    .compose-box {
      grid-template-columns: 42px minmax(0, 1fr) 66px;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <section class="chat-shell" aria-label="Kotak pesan buyer">
      <header class="chat-top">
        <a class="brand-mark" href="index.html" aria-label="KokoRBX"></a>
        <div class="top-title">
          <strong id="top-product">Kotak Pesan KokoRBX</strong>
          <span id="top-meta">Order buyer view</span>
        </div>
        <span class="status-pill"><span class="status-dot"></span><span id="top-status">Online</span></span>
      </header>

      <div class="chat-log" id="chat-log">
        <span class="day-chip">Hari ini</span>
      </div>

      <div class="quick-actions">
        <button class="quick-btn light" id="agree-price">Setuju Harga</button>
        <button class="quick-btn" id="paid-btn">Saya Sudah Bayar</button>
        <button class="quick-btn light" id="proof-btn">Upload Bukti</button>
        <button class="quick-btn light" id="done-btn">Konfirmasi Selesai</button>
      </div>

      <form class="compose" id="chat-form">
        <div class="compose-box">
          <button class="icon-btn" type="button" id="attach-btn">+</button>
          <textarea id="chat-input" placeholder="Tulis pesan ke admin..."></textarea>
          <button class="send-btn" type="submit">Kirim</button>
        </div>
      </form>
    </section>

    <aside class="side-panel">
      <div class="side-head">
        <div>
          <div class="side-title">Detail Order</div>
          <div class="side-sub" id="side-id">Order ID</div>
        </div>
        <div class="product-img"><img id="side-image" src="assets/marketplace/item-bundle.png" alt="Produk"></div>
      </div>
      <div class="side-body">
        <div class="order-box">
          <h3 id="side-product">Item Roblox</h3>
          <div class="kv">
            <div class="kv-row"><span>Status</span><strong id="side-status">Menunggu</strong></div>
            <div class="kv-row"><span>Total</span><strong id="side-total">Menunggu harga</strong></div>
            <div class="kv-row"><span>Buyer</span><strong id="side-buyer">tamu_4745</strong></div>
            <div class="kv-row"><span>Token</span><strong id="side-token">Demo buyer</strong></div>
          </div>
        </div>
        <div class="order-box">
          <h3>Aksi Buyer</h3>
          <div class="kv">
            <button class="side-btn light" id="copy-id" type="button">Copy Order ID</button>
            <button class="side-btn light" id="reset-demo" type="button">Reset Chat Demo</button>
          </div>
        </div>
        <div class="protect">
          <strong>Chat di luar KokoRBX tidak dilindungi admin</strong>
          <span>Gunakan kotak pesan ini supaya harga, bukti bayar, dan status order tetap tercatat.</span>
        </div>
      </div>
    </aside>
  </main>

<script>
  const STORAGE_KEY = 'kokorbx_buyer_room_preview';
  const params = new URLSearchParams(location.search);
  const requestedOrder = params.get('order') || 'ITM-394711';
  const roomToken = params.get('token') || 'demo-buyer';

  const demoOrder = {
    id: requestedOrder,
    product: 'Item Limited Roblox',
    category: 'Item Game',
    buyer: 'tamu_4745',
    image: 'assets/marketplace/item-bundle.png',
    total: 'Menunggu harga',
    status: 'Menunggu admin',
    messages: [
      { role: 'system', text: 'Transaksi dibuat di Kotak Pesan KokoRBX. Untuk keamanan, jangan lanjut chat atau pembayaran di luar website.', time: Date.now() - 1000 * 60 * 18 },
      { role: 'buyer', text: 'Halo kak, aku mau cari item limited yang warna ungu. Stoknya ada?', time: Date.now() - 1000 * 60 * 16 },
      { role: 'admin', text: 'Ada kak, aku cek harga dan stok final dulu ya. Nanti aku kirim harga deal di sini.', time: Date.now() - 1000 * 60 * 9 },
      { role: 'admin', text: 'Admin memantau transaksi ini. Pastikan semua bukti dan kesepakatan tetap di Kotak Pesan KokoRBX.', time: Date.now() - 1000 * 60 * 6 }
    ]
  };

  let room = loadRoom();

  function loadRoom() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (parsed && parsed.id === requestedOrder) return parsed;
    } catch(e) {}
    return JSON.parse(JSON.stringify(demoOrder));
  }

  function saveRoom() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(room));
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
  }

  function timeShort(time) {
    const diff = Math.max(0, Date.now() - Number(time || Date.now()));
    const min = Math.max(1, Math.floor(diff / 60000));
    if (min < 60) return min + ' menit lalu';
    return Math.floor(min / 60) + ' jam lalu';
  }

  function initials(role) {
    if (role === 'buyer') return 'B';
    if (role === 'admin') return 'A';
    if (role === 'seller') return 'A';
    return 'K';
  }

  function renderRoom() {
    document.getElementById('top-product').textContent = room.product;
    document.getElementById('top-meta').textContent = room.id + ' • ' + room.total;
    document.getElementById('top-status').textContent = room.status;
    document.getElementById('side-id').textContent = room.id;
    document.getElementById('side-image').src = room.image;
    document.getElementById('side-product').textContent = room.product;
    document.getElementById('side-status').textContent = room.status;
    document.getElementById('side-total').textContent = room.total;
    document.getElementById('side-buyer').textContent = room.buyer;
    document.getElementById('side-token').textContent = roomToken;

    const log = document.getElementById('chat-log');
    log.innerHTML = '<span class="day-chip">Hari ini</span>' + room.messages.map(message => {
      if (message.role === 'system') {
        return '<div class="bubble system"><div class="bubble-name"><span>System</span><span>' + timeShort(message.time) + '</span></div><div class="bubble-text">' + escapeHtml(message.text) + '</div></div>';
      }
      const mine = message.role === 'buyer';
      const avatar = '<div class="avatar ' + message.role + '">' + initials(message.role) + '</div>';
      const bubble = '<div class="bubble"><div class="bubble-name"><span>' + escapeHtml(message.role) + '</span></div><div class="bubble-text">' + escapeHtml(message.text) + '</div><span class="bubble-time">' + timeShort(message.time) + '</span></div>';
      return '<div class="bubble-row ' + (mine ? 'me' : '') + '">' + (mine ? bubble + avatar : avatar + bubble) + '</div>';
    }).join('');
    log.scrollTop = log.scrollHeight;
  }

  function addMessage(role, text) {
    const clean = String(text || '').trim();
    if (!clean) return;
    room.messages.push({ role, text: clean, time: Date.now() });
    saveRoom();
    renderRoom();
  }

  function setStatus(status, total) {
    room.status = status || room.status;
    if (total) room.total = total;
    saveRoom();
    renderRoom();
  }

  document.getElementById('chat-form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('chat-input');
    addMessage('buyer', input.value);
    input.value = '';
  });

  document.getElementById('agree-price').addEventListener('click', () => {
    addMessage('buyer', 'Aku setuju dengan harga yang dikirim. Lanjut pembayaran ya.');
    setStatus('Menunggu pembayaran');
  });

  document.getElementById('paid-btn').addEventListener('click', () => {
    addMessage('buyer', 'Aku sudah bayar. Tolong cek bukti pembayaran ya.');
    setStatus('Pembayaran dicek');
  });

  document.getElementById('proof-btn').addEventListener('click', () => {
    addMessage('buyer', 'Bukti pembayaran sudah aku upload di order ini. (Preview)');
    setStatus('Bukti masuk');
  });

  document.getElementById('done-btn').addEventListener('click', () => {
    addMessage('buyer', 'Item sudah aku terima. Order boleh diselesaikan.');
    setStatus('Konfirmasi selesai');
  });

  document.getElementById('attach-btn').addEventListener('click', () => {
    addMessage('buyer', 'Aku mau lampirkan bukti/gambar. (Preview upload)');
  });

  document.getElementById('copy-id').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(room.id);
      addMessage('system', 'Order ID disalin: ' + room.id);
    } catch(e) {
      addMessage('system', 'Order ID: ' + room.id);
    }
  });

  document.getElementById('reset-demo').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    room = loadRoom();
    saveRoom();
    renderRoom();
  });

  saveRoom();
  renderRoom();
</script>
</body>
</html>
